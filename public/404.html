<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page introuvable — KyllBot Studio</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <main style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center">
    <div>
      <a class="brand" href="/" style="justify-content:center">
        <img src="/assets/logo.svg" alt="" width="36" height="36" />
        KyllBot Studio <span class="brand-suffix">Officiel</span>
      </a>
      <div style="font-size:clamp(4rem,14vw,7rem);font-weight:800;letter-spacing:-.06em;line-height:1;margin:28px 0 6px" class="gradient-text">404</div>
      <h1 style="font-size:22px;letter-spacing:-.03em;margin-bottom:10px">Cette page n'existe pas</h1>
      <p style="color:var(--muted);font-size:14px;max-width:380px;margin:0 auto 26px">Le lien est peut-être expiré, ou la page a été déplacée. Retournez au studio pour continuer.</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <a class="btn btn-primary" href="/app">Ouvrir le studio</a>
        <a class="btn btn-ghost" href="/">Retour à l'accueil</a>
      </div>
    </div>
  </main>
</body>
</html>
